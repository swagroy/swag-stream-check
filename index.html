<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWAG 直播推拉流品質診斷系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* 配合新 Logo 的專屬蒂芬妮綠色系 */
            brand: '#12E5B6',       
            brandHover: '#0DAA87',
            brandText: '#000000',   
            bgDark: '#09090B',       /* 極黑背景 */
            card: '#18181B',         /* 沉穩深灰卡片 */
            borderCol: '#27272A',    /* 質感邊線 */
            textMuted: '#A1A1AA'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bgDark text-gray-200 min-h-screen py-8 px-4 font-sans antialiased selection:bg-brand selection:text-black">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- 頂部 Header -->
    <header class="flex items-center justify-between pb-4 border-b border-borderCol">
      <div class="flex items-center gap-4">
        <!-- 讀取新版圓形 Logo -->
        <img src="SWAG-favicon.png" alt="SWAG Logo" class="h-9 w-9 object-contain rounded-full shadow-md" onerror="this.style.display='none'">
        <div class="h-5 w-px bg-borderCol"></div>
        <h1 class="text-lg font-semibold text-gray-100 tracking-wide">
          直播推拉流品質診斷系統
        </h1>
      </div>

      <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
        <span class="relative flex h-1.5 w-1.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
        </span>
        System Operational
      </div>
    </header>

    <!-- 診斷輸入區 -->
    <section class="bg-card rounded-xl border border-borderCol p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-gray-100">診斷資料輸入</h2>
        <span class="text-xs text-textMuted flex items-center gap-1">
          支援點擊框格後按 <kbd class="px-1.5 py-0.5 bg-black border border-borderCol rounded text-gray-300 font-mono">Ctrl+V</kbd>
        </span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
        <!-- 主播推流 -->
        <div>
          <label class="block text-xs font-medium text-textMuted mb-2">主播推流截圖</label>
          <input type="file" id="streamerFile" accept="image/*" class="hidden" onchange="handleFileSelect(this.files[0], 'streamer')" />
          <div id="streamerBox" tabindex="0" onclick="focusBox('streamer')"
               class="w-full h-40 border border-dashed border-gray-600 hover:border-brand focus:border-brand focus:ring-1 focus:ring-brand rounded-lg bg-black/20 flex flex-col items-center justify-center cursor-pointer transition-colors overflow-hidden relative">
            <img id="streamerPreview" class="hidden w-full h-full object-contain p-1" />
            <div id="streamerPlaceholder" class="text-center text-textMuted">
              <svg class="w-5 h-5 mx-auto mb-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              <p class="text-xs">貼上截圖</p>
            </div>
          </div>
        </div>

        <!-- 用戶拉流 -->
        <div>
          <label class="block text-xs font-medium text-textMuted mb-2">用戶拉流截圖</label>
          <input type="file" id="userFile" accept="image/*" class="hidden" onchange="handleFileSelect(this.files[0], 'user')" />
          <div id="userBox" tabindex="0" onclick="focusBox('user')"
               class="w-full h-40 border border-dashed border-gray-600 hover:border-gray-400 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 rounded-lg bg-black/20 flex flex-col items-center justify-center cursor-pointer transition-colors overflow-hidden relative">
            <img id="userPreview" class="hidden w-full h-full object-contain p-1" />
            <div id="userPlaceholder" class="text-center text-textMuted">
              <svg class="w-5 h-5 mx-auto mb-1 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              <p class="text-xs">貼上截圖</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 參數輸入 -->
      <div class="flex flex-col sm:flex-row gap-4 pt-4 border-t border-borderCol">
        <div class="flex-1">
          <label class="block text-xs font-medium text-textMuted mb-1.5">用戶 ID (選填)</label>
          <input type="text" id="userIdInput" placeholder="輸入 ID" class="w-full bg-black/40 border border-borderCol text-gray-200 text-sm rounded-md focus:ring-1 focus:ring-brand focus:border-brand block p-2 outline-none transition">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-medium text-textMuted mb-1.5">門票鑽石 (選填)</label>
          <div class="relative">
            <input type="number" id="ticketPriceInput" placeholder="例如: 500" class="w-full bg-black/40 border border-borderCol text-gray-200 text-sm rounded-md focus:ring-1 focus:ring-brand focus:border-brand block p-2 pr-8 outline-none transition" min="0">
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-textMuted text-xs font-medium">鑽</span>
          </div>
        </div>
      </div>

      <!-- 專業版分析按鈕 -->
      <button id="submitBtn" onclick="startAnalysis()" 
              class="w-full mt-5 py-2.5 rounded-md font-semibold text-brandText text-sm transition-colors bg-brand hover:bg-brandHover flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <svg id="btnIcon" class="w-4 h-4 hidden animate-spin text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span id="btnText">執行分析</span>
      </button>
    </section>

    <!-- 診斷結果區 -->
    <section id="resultCard" class="hidden bg-card rounded-xl border border-borderCol p-6 shadow-sm space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-borderCol">
        <div class="flex items-center gap-3">
          <h2 class="text-base font-semibold text-gray-100">診斷報告</h2>
          <span id="statusTag" class="px-2 py-0.5 rounded text-xs font-medium border"></span>
          <span id="compensationTag" class="px-2 py-0.5 rounded text-xs font-medium border"></span>
        </div>
        <button onclick="copyReply()" 
                class="flex items-center gap-1.5 bg-borderCol hover:bg-gray-700 text-gray-200 text-xs font-medium px-3 py-1.5 rounded transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          複製回覆
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <h3 class="text-xs font-medium text-textMuted mb-2">技術解析</h3>
          <div class="bg-black/20 p-4 rounded-lg border border-borderCol/50 h-full">
            <p id="diagText" class="text-sm text-gray-300 leading-relaxed whitespace-pre-wrap"></p>
          </div>
        </div>

        <div>
          <h3 class="text-xs font-medium text-textMuted mb-2">建議話術</h3>
          <div class="bg-black/20 p-4 rounded-lg border border-borderCol/50 h-full">
            <p id="replyText" class="text-sm text-gray-200 leading-relaxed whitespace-pre-wrap"></p>
          </div>
        </div>
      </div>

      <!-- 打款指令區 -->
      <div id="commandBlock" class="hidden mt-2 bg-emerald-950/20 border border-emerald-500/20 p-3 rounded-lg flex items-center justify-between gap-4">
        <div>
          <h3 class="text-[10px] font-bold uppercase text-emerald-500 mb-1">自動退鑽指令</h3>
          <code id="commandText" class="text-sm text-emerald-100 font-mono select-all"></code>
        </div>
        <button onclick="copyCommand()" class="shrink-0 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-medium px-3 py-1.5 rounded transition">
          複製指令
        </button>
      </div>
    </section>
  </div>

  <script>
    let images = { streamer: null, user: null };
    let currentTarget = 'streamer';

    function focusBox(target) { currentTarget = target; }

    function compressImage(dataUrl, maxWidth = 1200) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = dataUrl;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
      });
    }

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          handleFileSelect(item.getAsFile(), currentTarget);
          if (currentTarget === 'streamer') {
            document.getElementById('userBox').focus();
            currentTarget = 'user';
          }
          break;
        }
      }
    });

    ['streamerBox', 'userBox'].forEach((boxId) => {
      const box = document.getElementById(boxId);
      const target = boxId === 'streamerBox' ? 'streamer' : 'user';
      box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('border-brand'); });
      box.addEventListener('dragleave', (e) => { e.preventDefault(); box.classList.remove('border-brand'); });
      box.addEventListener('drop', (e) => {
        e.preventDefault(); box.classList.remove('border-brand');
        if (e.dataTransfer.files[0]) {
          handleFileSelect(e.dataTransfer.files[0], target);
          if (target === 'streamer') { document.getElementById('userBox').focus(); currentTarget = 'user'; }
        }
      });
      box.addEventListener('dblclick', () => document.getElementById(target + 'File').click());
    });

    function handleFileSelect(file, target) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const img = document.getElementById(`${target}Preview`);
        img.src = e.target.result;
        img.classList.remove('hidden');
        document.getElementById(`${target}Placeholder`).classList.add('hidden');
        images[target] = await compressImage(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    async function startAnalysis() {
      if (!images.streamer || !images.user) return alert('請貼上主客雙方截圖！');

      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      
      const userId = document.getElementById('userIdInput').value.trim();
      const ticketPrice = document.getElementById('ticketPriceInput').value.trim();

      btn.disabled = true;
      btnIcon.classList.remove('hidden');
      
      const loadingPhrases = ["上傳影像...", "解析圖表...", "判定責任...", "生成報告..."];
      let phraseIndex = 0;
      btnText.innerText = loadingPhrases[0];
      const loadingInterval = setInterval(() => {
        phraseIndex = (phraseIndex + 1) % loadingPhrases.length;
        btnText.innerText = loadingPhrases[phraseIndex];
      }, 1500);

      try {
        const res = await fetch('/api/diagnose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ streamerImage: images.streamer, userImage: images.user, ticketPrice })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '診斷失敗');

        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('diagText').innerText = data.diagnosis;
        document.getElementById('replyText').innerText = data.replyScript;

        const compTag = document.getElementById('compensationTag');
        const commandBlock = document.getElementById('commandBlock');
        const commandText = document.getElementById('commandText');

        if (data.isEligibleForCompensation) {
          compTag.innerText = '✓ 需補償';
          compTag.className = 'px-2 py-0.5 rounded text-xs font-medium border border-emerald-500/30 bg-emerald-500/10 text-emerald-400';
          commandText.innerText = `@bot-allan deposit ${userId || '{ID}'}/${ticketPrice || '{票價}'} cs:comp_livestream_表演異常`;
          commandBlock.classList.remove('hidden');
        } else {
          compTag.innerText = '✕ 不補償';
          compTag.className = 'px-2 py-0.5 rounded text-xs font-medium border border-gray-600 bg-gray-800 text-gray-300';
          commandBlock.classList.add('hidden');
        }

        const statusTag = document.getElementById('statusTag');
        statusTag.innerText = data.faultSide === 'streamer' ? '主播異常' : '用戶異常';
        statusTag.className = 'px-2 py-0.5 rounded text-xs font-medium border border-brand/30 bg-brand/10 text-brand text-opacity-90';

        document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        alert(err.message);
      } finally {
        clearInterval(loadingInterval);
        btnText.innerText = '執行分析';
        btnIcon.classList.add('hidden');
        btn.disabled = false;
      }
    }

    function copyReply() {
      navigator.clipboard.writeText(document.getElementById('replyText').innerText);
      const btn = event.currentTarget;
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '已複製';
      btn.classList.add('bg-brand', 'text-black');
      setTimeout(() => { btn.innerHTML = oldHtml; btn.classList.remove('bg-brand', 'text-black'); }, 1500);
    }

    function copyCommand() {
      navigator.clipboard.writeText(document.getElementById('commandText').innerText);
      const btn = event.currentTarget;
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '已複製';
      btn.classList.add('bg-emerald-500', 'text-black');
      setTimeout(() => { btn.innerHTML = oldHtml; btn.classList.remove('bg-emerald-500', 'text-black'); }, 1500);
    }
  </script>
</body>
</html>
